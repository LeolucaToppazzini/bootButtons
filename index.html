
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Titolo della pagina</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
<div class="row">
<div class="col">
    <button type="button">pulsante</button>
    <button type="button" class="btn btn-primary">pulsante</button>
    <button type="button" class="btn btn-outline-danger">pulsante</button>
    

    <button class="btn btn-info btn-lg">
        <i class="bi bi-terminal"></i> Maggiori info
      </button>

</div>
</div>
<div class="row">
<div class="col-3">
    
    <div class="card pokemon-card fire-card">

    <!-- Header della carta -->
    <div class="card-header pokemon-header d-flex justify-content-between align-items-center">
        <strong>CHARIZARD</strong>
        <span class="badge bg-danger">Fuoco</span>
    </div>

    <!-- Immagine -->
    <img src="https://placehold.co/300x180?text=Charizard"
         class="card-img-top pokemon-image"
         alt="Charizard">

    <!-- Corpo della carta -->
    <div class="card-body">

        <!-- Statistiche -->
        <div class="pokemon-stats d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-warning text-dark">Livello 50</span>
            <strong>HP 120</strong>
        </div>

        <h5 class="card-title pokemon-name">Charizard</h5>

        <p class="card-text">
            Un Pokémon di tipo Fuoco e Volante.
            Sputa fiamme molto potenti.
        </p>

        <hr>

        <!-- Attacchi -->
        <h6>Attacchi</h6>

        <div class="pokemon-attack d-flex justify-content-between align-items-center">
            <span>Braciere</span>
            <strong>30 DMG</strong>
        </div>

        <div class="pokemon-attack d-flex justify-content-between align-items-center">
            <span>Fuocobomba</span>
            <strong>80 DMG</strong>
        </div>

        <hr>

        <!-- Pulsante -->
        <div class="d-grid">
            <button type="button" class="btn pokemon-button">
                Gioca carta
            </button>
        </div>

    </div>

    <!-- Footer -->
    <div class="card-footer text-center">
        <small class="text-muted">Carta Pokémon #006</small>
    </div>

</div>

</div>
</div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
